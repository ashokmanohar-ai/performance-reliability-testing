name: Nightly load and regression

on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_DB: acme_commerce
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: ci-only-postgres-password
      DATABASE_URL: postgresql://acme:ci-only-postgres-password@localhost:5432/acme_commerce
      AUTH_SECRET: ci-only-auth-secret-with-more-than-32-characters
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      TEST_PASSWORD: performance-test
      BASE_URL: http://localhost:3000
      TEST_ENV: LOCAL
      RESULT_FILE: results/current/nightly-load-summary.json
      TARGET_VUS: 20
      TEST_DURATION: 2m
      MAX_DURATION: 10m
      CI_SAFE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: grafana/setup-k6-action@v1
      - uses: actions/cache/restore@v4
        id: baseline
        with:
          path: results/baseline/nightly.json
          key: nightly-baseline-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: nightly-baseline-${{ github.ref_name }}-
      - run: npm ci
      - run: npm run validate
      - run: docker compose up -d --build
      - run: node scripts/wait-for-health.js && npm run data:seed
      - run: npm run perf:load
      - name: Absolute quality gate
        env:
          SKIP_REGRESSION: 'true'
        run: npm run perf:gate
      - name: Compare with prior equivalent nightly run
        if: steps.baseline.outputs.cache-hit == 'true'
        run: npm run perf:regression -- results/current/nightly-load-summary.json results/baseline/nightly.json
      - run: npm run perf:report
      - name: Save measured baseline for next run
        run: mkdir -p results/baseline && cp results/current/nightly-load-summary.json results/baseline/nightly.json
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: results/baseline/nightly.json
          key: nightly-baseline-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-performance-${{ github.run_id }}
          path: |
            results/current/
            results/reports/
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
